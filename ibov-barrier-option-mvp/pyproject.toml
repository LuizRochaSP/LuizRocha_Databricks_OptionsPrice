[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibov-barrier-option"
version = "0.1.0"
description = "Monte Carlo pricing and risk for an Ibovespa barrier option"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
